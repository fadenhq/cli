name: Release

# Publishes @fadenhq/cli to npm when a cli-v* tag is pushed (e.g. cli-v0.1.1).
# Auth is npm trusted publishing (OIDC): no token secret; the package's
# Trusted Publisher on npmjs.com is pinned to this repo + workflow.
# Provenance attestation is generated automatically.

on:
  push:
    tags: ["cli-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; pin past whatever the runner ships.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check tag matches package version
        run: |
          pkg=$(node -p "require('./apps/cli/package.json').version")
          if [ "cli-v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/cli version $pkg" >&2
            exit 1
          fi

      # A release with no changelog entry is a release nobody can read. Fail here,
      # before publishing, since npm versions cannot be reused once taken.
      - name: Extract changelog section
        run: |
          pkg=$(node -p "require('./apps/cli/package.json').version")
          awk -v h="## [$pkg]" 'index($0, h) == 1 { found = 1; next }
                                /^## \[/ { found = 0 }
                                found' apps/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ] || ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "apps/cli/CHANGELOG.md has no '## [$pkg]' section with content" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish -w @fadenhq/cli

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(node -p "require('./apps/cli/package.json').version")
          printf '\n---\n\n`npm install -g @fadenhq/cli@%s` — [npm](https://www.npmjs.com/package/@fadenhq/cli/v/%s)\n' \
            "$pkg" "$pkg" >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "faden CLI $pkg" \
            --notes-file "$RUNNER_TEMP/notes.md"
