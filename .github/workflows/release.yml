name: Release

# Publishes @fadenhq/cli to npm when a cli-v* tag is pushed (e.g. cli-v0.1.1).
# Auth is npm trusted publishing (OIDC): no token secret; the package's
# Trusted Publisher on npmjs.com is pinned to this repo + workflow.
# Provenance attestation is generated automatically.

on:
  push:
    tags: ["cli-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; pin past whatever the runner ships.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check tag matches package version
        run: |
          pkg=$(node -p "require('./apps/cli/package.json').version")
          if [ "cli-v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/cli version $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish -w @fadenhq/cli
